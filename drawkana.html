<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multilingual Handwriting & Romanizer</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chinese Pinyin Library -->
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>

  <!-- Kuroshiro & Kuromoji for Japanese -->
  <script src="https://cdn.jsdelivr.net/npm/kuroshiro@1.2.0/dist/kuroshiro.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/kuroshiro-analyzer-kuromoji@1.1.0/dist/kuroshiro-analyzer-kuromoji.min.js"></script>

  <!-- === CHECKPOINT 5 (HEAD): Fix 3 Offline Recognition Engines (KanjiCanvas + HanziLookupJS) === -->
  <script src="https://cdn.jsdelivr.net/gh/asdfjkl/kanjicanvas@master/docs/resources/javascript/kanji-canvas.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/gh/asdfjkl/kanjicanvas@master/docs/resources/javascript/ref-patterns.js" defer></script>
  <script src="https://cdn.jsdelivr.net/gh/gugray/HanziLookupJS@master/dist/hanzilookup.min.js" defer></script>
  <!-- === END CHECKPOINT 5 (HEAD) === -->

  <style>
    /* ==========================================================================
       === CHECKPOINT 1 (CSS): Box 1 Furigana Overlay vs. Furifont Rollback ===
       To revert to Furifont: uncomment the @font-face + .furifont-ja rules below
       and remove the .box1-shared-metrics / #furigana-backdrop rules.
       ========================================================================== */
    /*
    @font-face {
      font-family: 'Furifont Sans';
      src: local('Furifont Sans VF'),
           local('Furifont Sans'),
           url('https://furifont.antfu.me/fonts/FurifontSans-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    #text-output-box.furifont-ja {
      font-family: 'Furifont Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      line-height: 1.85;
      padding-top: 0.9rem;
      font-variant-ligatures: common-ligatures contextual;
      font-feature-settings: "liga" 1, "rclt" 1, "ccmp" 1;
    }
    */

    /* Shared typography metrics so #text-output-box and #furigana-backdrop align 1:1 */
    .box1-shared-metrics {
      font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', ui-monospace, SFMono-Regular, monospace;
      font-size: 1.35rem;
      font-weight: 500;
      line-height: 2.15;
      letter-spacing: 0.04em;
      padding: 0.85rem 0.65rem 0.45rem 0.65rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      tab-size: 4;
    }

    /* ==========================================================================
       === CHECKPOINT 4 (CSS): Auto-Growing 2-Line Boxes Without Scrollbars ===
       Previous fixed-height scrollbar setup:
       #furigana-backdrop, #text-output-box, #romanized-output-box { height: 6rem; overflow-y: auto; }
       ========================================================================== */
    .auto-grow-box {
      min-height: 5.4rem; /* Default height for 2 lines of text + furigana headroom */
      height: 5.4rem;
      overflow: hidden !important;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .auto-grow-box::-webkit-scrollbar {
      display: none;
    }
    /* === END CHECKPOINT 4 (CSS) === */

    /* When Japanese overlay mode is active, textarea text is transparent while caret stays visible */
    #text-output-box.overlay-ja-active {
      color: transparent;
      caret-color: #1e293b;
      background-color: transparent;
    }

    #text-output-box.overlay-ja-active::selection {
      background-color: rgba(99, 102, 241, 0.22);
      color: transparent;
    }

    /* Ruby styling inside backdrop: absolute <rt> prevents long furigana from shifting character width */
    #furigana-backdrop ruby {
      display: inline-block;
      position: relative;
      vertical-align: baseline;
      line-height: 1;
    }

    #furigana-backdrop rt {
      display: block;
      position: absolute;
      bottom: 104%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.44em;
      font-weight: 600;
      line-height: 1.1;
      color: #4f46e5;
      white-space: nowrap;
      letter-spacing: normal;
      pointer-events: none;
      user-select: none;
    }

    #furigana-backdrop rp {
      display: none;
    }
    /* === END CHECKPOINT 1 (CSS) === */

    /* ==========================================================================
       Aspect-Ratio Responsive Layout (Portrait vs. Landscape)
       ========================================================================== */
    .dual-boxes-grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr;
      align-items: stretch;
    }

    /* Landscape aspect ratio: keep Box 1 and Box 2 side by side */
    @media (orientation: landscape) {
      .dual-boxes-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .canvas-viewport {
        height: clamp(145px, 34vh, 260px);
      }
    }

    /* Portrait aspect ratio: stack Box 1 on top and Box 2 on bottom */
    @media (orientation: portrait) {
      .dual-boxes-grid {
        grid-template-columns: 1fr;
      }
      .canvas-viewport {
        height: clamp(175px, 28vh, 260px);
      }
    }

    /* Prevent default gestures on touch canvas */
    #drawing-canvas {
      touch-action: none;
      cursor: crosshair;
    }
    
    /* Guide backgrounds */
    .cjk-grid {
      background-image: 
        linear-gradient(to right, rgba(203, 213, 225, 0.45) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(203, 213, 225, 0.45) 1px, transparent 1px);
      background-size: 50% 50%;
      background-position: center center;
    }

    .cyrillic-grid {
      background-image: 
        linear-gradient(to bottom, 
          transparent 0%, 
          transparent 24%, 
          rgba(203, 213, 225, 0.5) 25%, 
          transparent 26%, 
          transparent 49%, 
          rgba(148, 163, 184, 0.7) 50%, 
          transparent 51%, 
          transparent 74%, 
          rgba(203, 213, 225, 0.5) 75%, 
          transparent 76%
        );
      background-size: 100% 100%;
    }

    /* Candidate scrollbar styling */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans selection:bg-indigo-100 selection:text-indigo-800">

  <!-- Ultra-Compact Header (Flags Only + Hover Status Light) -->
  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <!-- App Icon -->
        <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-sm shrink-0">

            <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
          </svg>

        <!-- Flag-Only Language Navigation Tabs -->

            <span>🇰🇷</span>

          <button data-lang="ru" title="Russian (Cyrillic / Latin)" aria-label="Russian" class="lang-tab py-1.5 px-3 text-xl leading-none border-b-2 border-transparent text-slate-600 hover:border-slate-300 transition-colors">

      <!-- Engine Status Light (Text Revealed Only on Mouseover) -->
      <div id="status-badge" title="Loading Kuromoji dict..." class="group flex items-center text-xs font-medium p-1.5 hover:px-2.5 hover:py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200 transition-all cursor-default">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse shrink-0"></span>

  </header>

  <!-- Main Workspace -->
  <main class="max-w-5xl w-full mx-auto px-4 py-3 flex-1 flex flex-col space-y-3">

    <!-- Top Drawing Workspace Card -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-3 sm:p-4 flex flex-col space-y-2.5">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span class="text-xs uppercase font-bold tracking-wider text-slate-400" id="drawing-instructions">Draw Japanese Character</span>
          <span id="recognizing-indicator" class="hidden text-xs text-indigo-600 font-medium animate-pulse">Recognizing...</span>
        </div>
        <div class="flex items-center space-x-2">
          <button id="btn-undo" class="px-2.5 py-1 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors flex items-center space-x-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
            <span>Undo Stroke</span>
          </button>
          <button id="btn-clear-canvas" class="px-2.5 py-1 text-xs font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg transition-colors flex items-center space-x-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            <span>Clear Canvas</span>
          </button>
        </div>
      </div>

      <!-- Drawing Canvas Area -->
      <div class="canvas-viewport relative w-full bg-slate-50/50 rounded-xl border border-slate-200 overflow-hidden flex items-center justify-center">
        <div id="grid-guide" class="absolute inset-0 cjk-grid pointer-events-none"></div>
        <canvas id="drawing-canvas" class="relative z-10 w-full h-full"></canvas>
        <!-- Offscreen 256x256 Canvas for Fix 3 (KanjiCanvas Offline Recognition) -->
        <canvas id="offline-kanji-canvas" width="256" height="256" class="hidden pointer-events-none"></canvas>
      </div>

      <!-- Candidate Selection Strip -->
      <div>
        <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1 flex justify-between items-center">
          <span>Recognition Candidates</span>
          <span class="text-[10px] lowercase text-slate-400 font-normal">Click candidate to insert without focusing box</span>
        </div>
        <div id="candidates-container" class="flex items-center space-x-2 overflow-x-auto p-1 min-h-[42px] bg-slate-50 border border-slate-200/80 rounded-xl hide-scrollbar">
          <span class="text-xs text-slate-400 italic px-3">Draw a character on the canvas above...</span>
        </div>
      </div>
    </div>

    <!-- Dual Textboxes Section (Synchronized Size, Side-by-Side in Landscape, Stacked in Portrait) -->
    <div class="dual-boxes-grid">
      
      <!-- Box 1: Editable Character Input -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-3 flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <div class="flex items-center space-x-2">
              <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
              <label for="text-output-box" class="text-xs font-bold uppercase tracking-wider text-slate-600">
                Box 1: Character Text <span class="font-normal lowercase text-slate-400">(Editable · Synced Furigana)</span>
              </label>
            </div>
            <div class="flex items-center space-x-1">
              <button id="btn-copy-box1" title="Copy Text" class="px-2 py-1 text-xs text-slate-600 hover:text-indigo-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors flex items-center space-x-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                <span>Copy</span>
              </button>
            </div>
          </div>

          <!-- ====================================================================
               === CHECKPOINT 2 & 4 (HTML): Auto-Growing Box 1 Overlay Wrapper ===
               ==================================================================== -->
          <div id="box1-wrapper" class="auto-grow-box relative w-full bg-white border border-slate-200 rounded-xl focus-within:ring-2 focus-within:ring-indigo-500/20 focus-within:border-indigo-500 transition-colors">
            <!-- Synced Furigana Backdrop Layer -->
            <div

              aria-hidden="true"
              class="box1-shared-metrics auto-grow-box absolute inset-0 w-full text-slate-800 pointer-events-none select-none"
            ></div>

            <!-- Interactive Textarea Layer -->
            <textarea 
              id="text-output-box" 
              rows="2" 
              lang="ja"
              placeholder="Characters will appear here as you tap candidates, or type directly..." 
              class="box1-shared-metrics auto-grow-box overlay-ja-active relative z-10 w-full text-slate-800 bg-transparent border-0 resize-none focus:outline-none block"
            ></textarea>
          </div>
          <!-- === END CHECKPOINT 2 & 4 (HTML) === -->
        </div>

        <!-- Quick Editing Toolbar (Matched height with Box 2 footer) -->
        <div class="mt-2 flex items-center justify-between pt-1.5 border-t border-slate-100 min-h-[30px]">
          <div class="flex items-center space-x-1.5">
            <button id="btn-add-space" class="px-2.5 py-1 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
              Space ␣
            </button>
            <button id="btn-backspace" class="px-2.5 py-1 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
              ⌫ Backspace
            </button>
          </div>
          <button id="btn-clear-text" class="text-xs text-slate-400 hover:text-rose-600 transition-colors">

      <!-- Box 2: Read-Only Romanization Output -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-3 flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <div class="flex items-center space-x-2">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              <label for="romanized-output-box" class="text-xs font-bold uppercase tracking-wider text-slate-600">

            </div>
            <button id="btn-copy-box2" title="Copy Transliteration" class="px-2 py-1 text-xs text-slate-600 hover:text-emerald-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors flex items-center space-x-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
              <span>Copy</span>

          ></textarea>

        <div class="mt-2 flex items-center justify-between pt-1.5 border-t border-slate-100 text-[11px] text-slate-400 min-h-[30px]">
          <span id="translit-mode-description">Hiragana, Katakana & Joyo Kanji to Romaji</span>
          <span id="char-count">0 chars</span>

      </div>

    </div>
  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white text-xs px-4 py-2 rounded-xl shadow-xl transform translate-y-12 opacity-0 transition-all duration-200 pointer-events-none z-50 flex items-center space-x-2">
    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    <span id="toast-message">Copied to clipboard</span>
  </div>

  <script>
    /* ==========================================================================
       Language Profiles Configuration
       ========================================================================== */
    const LANGUAGES = {
      ja: {
        id: 'ja',
        name: 'Japanese',
        apiLang: 'ja-t-i0-handwrit',
        guideType: 'cjk',
        romajiName: 'Romaji (Hepburn)',
        instruction: 'Draw Japanese (Kanji, Hiragana, Katakana)',
        desc: 'Hiragana, Katakana & Joyo Kanji to Romaji'
      },
      zh: {
        id: 'zh',
        name: 'Chinese',
        apiLang: 'zh-t-i0-handwrit',
        guideType: 'cjk',
        romajiName: 'Pinyin (with Tones)',
        instruction: 'Draw Chinese Characters (Hanzi / Hanja)',
        desc: 'Simplified & Traditional Hanzi to Pinyin'
      },
      ko: {
        id: 'ko',
        name: 'Korean',
        apiLang: 'ko-t-i0-handwrit',
        guideType: 'cjk',
        romajiName: 'Revised Romanization (RR)',
        instruction: 'Draw Korean Characters (Hangul)',
        desc: 'Standard Revised Romanization of Korean'
      },
      ru: {
        id: 'ru',
        name: 'Russian',
        apiLang: 'ru-t-i0-handwrit',
        guideType: 'cyrillic',
        romajiName: 'Latin Transliteration',
        instruction: 'Draw Russian Cyrillic (Print or Cursive)',
        desc: 'BGN/PCGN & GOST Cyrillic Transliteration'
      }
    };

    let currentLang = 'ja';

    /* ==========================================================================
       DOM Elements
       ========================================================================== */
    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d');
    const candidatesContainer = document.getElementById('candidates-container');
    const box1Wrapper = document.getElementById('box1-wrapper');
    const textOutputBox = document.getElementById('text-output-box');
    const furiganaBackdrop = document.getElementById('furigana-backdrop');
    const romanizedOutputBox = document.getElementById('romanized-output-box');
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const recognizingIndicator = document.getElementById('recognizing-indicator');
    const gridGuide = document.getElementById('grid-guide');
    const drawingInstructions = document.getElementById('drawing-instructions');
    const romanizationLabel = document.getElementById('romanization-label');
    const translitDesc = document.getElementById('translit-mode-description');
    const charCount = document.getElementById('char-count');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toast-message');

    /* ==========================================================================
       Canvas & Stroke Tracking (Google Input Tools Ink Format)
       ========================================================================== */
    let strokes = [];
    let currentStroke = { x: [], y: [], t: [] };
    let isDrawing = false;
    let strokeStartTime = 0;
    let recognizeTimeout = null;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#1e1b4b';
      
      redrawStrokes();
      autoResizeBoxes();
    }

    function redrawStrokes() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      
      for (const stroke of strokes) {
        if (stroke.x.length === 0) continue;
        ctx.beginPath();
        ctx.moveTo(stroke.x[0], stroke.y[0]);
        if (stroke.x.length === 1) {
          ctx.lineTo(stroke.x[0] + 0.01, stroke.y[0]);
        } else {
          for (let i = 1; i < stroke.x.length; i++) {
            ctx.lineTo(stroke.x[i], stroke.y[i]);
          }
        }
        ctx.stroke();
      }
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.round(clientX - rect.left),
        y: Math.round(clientY - rect.top)
      };
    }

    function startDrawing(e) {
      e.preventDefault();
      clearTimeout(recognizeTimeout);
      isDrawing = true;
      strokeStartTime = Date.now();
      
      const { x, y } = getCoords(e);
      currentStroke = { x: [x], y: [y], t: [0] };
      
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + 0.01, y);
      ctx.stroke();
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const { x, y } = getCoords(e);
      const elapsed = Date.now() - strokeStartTime;
      
      currentStroke.x.push(x);
      currentStroke.y.push(y);
      currentStroke.t.push(elapsed);
      
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    function stopDrawing(e) {
      if (!isDrawing) return;
      e.preventDefault();
      isDrawing = false;
      
      if (currentStroke.x.length > 0) {
        strokes.push({ ...currentStroke });
      }
      
      clearTimeout(recognizeTimeout);
      recognizeTimeout = setTimeout(fetchHandwritingCandidates, 450);
    }

    function clearCanvas() {
      strokes = [];
      currentStroke = { x: [], y: [], t: [] };
      clearTimeout(recognizeTimeout);
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      renderCandidates([]);
    }

    function undoLastStroke() {
      if (strokes.length > 0) {
        strokes.pop();
        redrawStrokes();
        clearTimeout(recognizeTimeout);
        if (strokes.length > 0) {
          recognizeTimeout = setTimeout(fetchHandwritingCandidates, 300);
        } else {
          renderCandidates([]);
        }
      }
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: false });

       === CHECKPOINT 5 (JS): VPN-Resilient Handwriting Recognition ===
       - Fix 1: Multi-Endpoint Fallback Chain (Direct + Google Mirror + Relay Proxy)
       - Fix 2: Sanitized `device` payload & stripped Referrer/Credentials
       - Fix 3: Offline Client-Side Recognition (KanjiCanvas + HanziLookupJS)
       ========================================================================== */
    let isKanjiCanvasInitialized = false;
    let isHanziLookupOrigReady = false;
    let isHanziLookupMmahReady = false;

    function initOfflineRecognizers() {
      if (typeof KanjiCanvas !== 'undefined' && KanjiCanvas.init && !isKanjiCanvasInitialized) {
        try {
          KanjiCanvas.init('offline-kanji-canvas');
          isKanjiCanvasInitialized = true;
        } catch (e) {
          console.warn('KanjiCanvas init warning:', e);
        }
      }

      if (typeof HanziLookup !== 'undefined' && HanziLookup.init) {
        const HANZI_CDN = 'https://cdn.jsdelivr.net/gh/gugray/HanziLookupJS@master/dist/';
        if (!isHanziLookupOrigReady) {
          HanziLookup.init('orig', HANZI_CDN + 'orig.json', (ok) => {
            if (ok) isHanziLookupOrigReady = true;
          });
        }
        if (!isHanziLookupMmahReady) {
          HanziLookup.init('mmah', HANZI_CDN + 'mmah.json', (ok) => {
            if (ok) isHanziLookupMmahReady = true;
          });
        }
      }
    }

    async function recognizeOfflineFallback(rect) {
      if (strokes.length === 0) return [];
      const results = [];

      const scaleX = 256 / Math.max(rect.width, 1);
      const scaleY = 256 / Math.max(rect.height, 1);

      const normalizedStrokes256 = strokes
        .filter(s => s.x.length > 0)
        .map(s => s.x.map((x, idx) => [
          Math.round(x * scaleX),
          Math.round(s.y[idx] * scaleY)
        ]));

      if (typeof KanjiCanvas !== 'undefined' && KanjiCanvas.refPatterns) {
        try {
          if (!isKanjiCanvasInitialized && KanjiCanvas.init) {
            KanjiCanvas.init('offline-kanji-canvas');
            isKanjiCanvasInitialized = true;
          }
          KanjiCanvas['recordedPattern_offline-kanji-canvas'] = normalizedStrokes256.map(stroke =>
            stroke.map(pt => [pt[0], pt[1]])
          );
          const rawOut = KanjiCanvas.recognize('offline-kanji-canvas');
          if (typeof rawOut === 'string' && rawOut.trim()) {
            const parsed = rawOut.trim().split(/\s+/).filter(Boolean);
            for (const ch of parsed) {
              if (!results.includes(ch)) results.push(ch);
            }
          }
        } catch (e) {
          console.warn('KanjiCanvas fallback error:', e);
        }
      }

      if (typeof HanziLookup !== 'undefined' && (isHanziLookupMmahReady || isHanziLookupOrigReady)) {
        try {
          const analyzedChar = new HanziLookup.AnalyzedCharacter(normalizedStrokes256);
          const matcherName = (currentLang === 'zh' && isHanziLookupMmahReady)
            ? 'mmah'
            : (isHanziLookupOrigReady ? 'orig' : 'mmah');
          const matcher = new HanziLookup.Matcher(matcherName);

          const hanziMatches = await new Promise((resolve) => {
            matcher.match(analyzedChar, 10, (matches) => resolve(matches || []));
          });

          for (const m of hanziMatches) {
            if (m && m.character && !results.includes(m.character)) {
              results.push(m.character);
            }
          }
        } catch (e) {
          console.warn('HanziLookup fallback error:', e);
        }
      }

      return results.slice(0, 10);
    }

    async function postHandwritingWithTimeout(url, bodyString, timeoutMs = 3500) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, {
          method: "POST",
          mode: "cors",
          credentials: "omit",
          referrerPolicy: "no-referrer",
          headers: { "Content-Type": "application/json" },
          body: bodyString,
          signal: controller.signal
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (data && data[0] === "SUCCESS" && data[1] && data[1][0] && data[1][0][1]) {
          return data[1][0][1];
        }
        throw new Error("Invalid handwriting response payload");
      } finally {
        clearTimeout(timer);
      }
    }

      if (strokes.length === 0) return;
      
      recognizingIndicator.classList.remove('hidden');
      const rect = canvas.getBoundingClientRect();
      const inkPayload = strokes.map(s => [s.x, s.y, s.t]);
      const apiLang = LANGUAGES[currentLang].apiLang;
      
      const payload = {
        app_version: 0.4,
        api_level: "537.36",
        device: "5.0 (Windows)",
        input_type: 0,
        options: "enable_pre_space",
        requests: [
          {
            writing_guide: {
              writing_area_width: Math.round(rect.width),
              writing_area_height: Math.round(rect.height)
            },
            pre_context: "",
            max_num_results: 10,
            max_completions: 0,
            language: apiLang,
            ink: inkPayload
          }
        ]
      };

      const bodyString = JSON.stringify(payload);
      const primaryUrl = `https://inputtools.google.com/request?itc=${apiLang}&app=translate`;
      const mirrorUrl = `https://www.google.com/inputtools/request?ime=handwriting&itc=${apiLang}&app=mobilesearch&cs=1&oe=UTF-8`;

      const endpoints = [
        primaryUrl,
        mirrorUrl,
        `https://corsproxy.io/?${encodeURIComponent(primaryUrl)}`
      ];

      try {
        for (const endpoint of endpoints) {
          try {
            const candidates = await postHandwritingWithTimeout(endpoint, bodyString, 3500);
            if (candidates && candidates.length > 0) {

        renderCandidates(offlineCandidates);
      } finally {
        recognizingIndicator.classList.add('hidden');

    function katakanaToHiragana(str) {
      return str.replace(/[\u30A1-\u30F6]/g, (ch) =>
        String.fromCharCode(ch.charCodeAt(0) - 0x60)
      );
    }

    function kanaToRomajiString(str) {
      let res = '';
      let i = 0;
      while (i < str.length) {
        if (str[i] === 'っ' || str[i] === 'ッ') {
          if (i + 1 < str.length) {
            const nextTwo = str.substr(i + 1, 2);
            const nextOne = str[i + 1];
            const nextRomaji = KANA_MAP[nextTwo] || KANA_MAP[nextOne] || '';
            if (nextRomaji) {
              res += nextRomaji[0];
              i++;
              continue;
            }
          }
        }
        const twoChar = str.substr(i, 2);
        if (KANA_MAP[twoChar]) {
          res += KANA_MAP[twoChar];
          i += 2;
          continue;
        }
        if (KANA_MAP[str[i]]) {
          res += KANA_MAP[str[i]];
          i++;
          continue;
        }
        res += str[i];
        i++;
      }
      return res;
    }

    const KANJI_API_CACHE = {};
    const KANJI_REGEX = /[\u4E00-\u9FAF\u3400-\u4DBF]/;

    async function fetchKanjiApiData(char) {
      if (KANJI_API_CACHE[char]) return KANJI_API_CACHE[char];
      try {
        const res = await fetch(`https://kanjiapi.dev/v1/kanji/${encodeURIComponent(char)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        const kunList = (data.kun_readings || []).map(r => r.replace(/^-|-$/g, ''));
        const onList = (data.on_readings || []).map(r => katakanaToHiragana(r.replace(/^-|-$/g, '')));

        const okuriRules = [];
        let standaloneKun = null;

        for (const kun of kunList) {
          if (kun.includes('.')) {
            const [stem, okuri] = kun.split('.');
            if (stem && okuri) {
              okuriRules.push({ stem, okuri });
            }
          } else if (!standaloneKun && kun) {
            standaloneKun = kun;
          }
        }

        const primaryKana = standaloneKun
          || onList[0]
          || (okuriRules[0] ? okuriRules[0].stem : '')
          || (data.name_readings && data.name_readings[0])
          || '';

        const entry = {
          kana: primaryKana,
          romaji: kanaToRomajiString(primaryKana),
          onKana: onList[0] || primaryKana,
          onRomaji: kanaToRomajiString(onList[0] || primaryKana),
          okuriRules
        };

        KANJI_API_CACHE[char] = entry;
        return entry;
      } catch (e) {
        console.warn(`kanjiapi.dev lookup failed for ${char}:`, e.message);
        return null;
      }
    }

    async function ensureKanjiReadingsLoaded(str) {
      const missing = [];
      for (const ch of str) {
        if (KANJI_REGEX.test(ch) && !KANJI_API_CACHE[ch]) {
          missing.push(ch);
        }
      }
      if (missing.length > 0) {
        const unique = [...new Set(missing)];
        await Promise.all(unique.map(ch => fetchKanjiApiData(ch)));
      }
    }

    let isDictLoaderPatched = false;
    function ensureGzippedDictLoader() {
      if (isDictLoaderPatched) return;
      isDictLoaderPatched = true;

      const origOpen = XMLHttpRequest.prototype.open;
      const origSend = XMLHttpRequest.prototype.send;

      XMLHttpRequest.prototype.open = function (method, url, ...rest) {
        if (typeof url === 'string') {
          url = url.replace(/^(https?:)\/(?!\/)/i, '$1//');
        }
        this._kuromojiUrl = typeof url === 'string' && url.endsWith('.dat.gz') ? url : null;
        return origOpen.call(this, method, url, ...rest);
      };

      XMLHttpRequest.prototype.send = function (...args) {
        if (!this._kuromojiUrl || typeof CompressionStream === 'undefined') {
          return origSend.apply(this, args);
        }

        const xhr = this;
        fetch(this._kuromojiUrl)
          .then(async (res) => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            let buf = await res.arrayBuffer();
            const bytes = new Uint8Array(buf);
            const isGzip = bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;

            if (!isGzip) {
              const cs = new CompressionStream('gzip');
              const writer = cs.writable.getWriter();
              writer.write(bytes);
              writer.close();
              buf = await new Response(cs.readable).arrayBuffer();
            }

            Object.defineProperty(xhr, 'status', { value: 200, configurable: true });
            Object.defineProperty(xhr, 'response', { value: buf, configurable: true });
            if (typeof xhr.onload === 'function') xhr.onload();
          })
          .catch((err) => {
            if (typeof xhr.onerror === 'function') xhr.onerror(err);
          });
      };
    }

      const KuromojiAnalyzerClass = typeof KuromojiAnalyzer !== 'undefined' ? (KuromojiAnalyzer.default || KuromojiAnalyzer) : null;

            setTimeout(() => reject(new Error('Dictionary load timeout')), 15000)
          );

          const loadPromise = (async () => {
            const ks = new KuroshiroClass();
            const analyzer = new KuromojiAnalyzerClass({ dictPath });
            await ks.init(analyzer);
            return ks;
          })();

          kuroshiroInstance = await Promise.race([loadPromise, timeoutPromise]);
          isKuroshiroReady = true;
          setEngineStatus('ready', 'Kuroshiro + Kuromoji Ready');
          updateRomanization();
          return;
        } catch (e) {
          console.warn(`Kuromoji failed at ${dictPath}:`, e.message);

        statusBadge.className += 'bg-emerald-50 text-emerald-700 border-emerald-200';
        statusBadge.querySelector('span').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0';
      } else if (type === 'ready-fallback') {
        statusBadge.className += 'bg-blue-50 text-blue-700 border-blue-200';
        statusBadge.querySelector('span').className = 'w-2.5 h-2.5 rounded-full bg-blue-500 shrink-0';
      } else {
        statusBadge.className += 'bg-amber-50 text-amber-700 border-amber-200';
        statusBadge.querySelector('span').className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse shrink-0';
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>');
    }

    function resolveFallbackKanjiAt(str, i) {
      const ch = str[i];
      const rest = str.slice(i + 1);
      const apiEntry = KANJI_API_CACHE[ch];

      if (apiEntry && apiEntry.okuriRules) {
        for (const rule of apiEntry.okuriRules) {
          if (rest.startsWith(rule.okuri)) {
            return {
              kana: rule.stem,
              romaji: kanaToRomajiString(rule.stem),
              isOkuriStem: true
            };
          }
        }
      }

      if (KANJI_FALLBACK[ch]) {
        return {
          kana: KANJI_FALLBACK[ch].kana,
          romaji: KANJI_FALLBACK[ch].romaji,
          isOkuriStem: false
        };
      }

      if (apiEntry && apiEntry.kana) {
        const adjKanji = (i > 0 && KANJI_REGEX.test(str[i - 1])) || (i + 1 < str.length && KANJI_REGEX.test(str[i + 1]));
        return {
          kana: adjKanji ? apiEntry.onKana : apiEntry.kana,
          romaji: adjKanji ? apiEntry.onRomaji : apiEntry.romaji,
          isOkuriStem: false
        };
      }

      return null;
    }

    function fallbackJapaneseRomanize(str) {
      let res = '';
      let i = 0;
      while (i < str.length) {
        let compoundFound = false;
        for (let len = 4; len >= 2; len--) {
          const sub = str.substr(i, len);
          if (KANJI_FALLBACK[sub]) {
            res += (res && !res.endsWith(' ') ? ' ' : '') + KANJI_FALLBACK[sub].romaji + ' ';
            i += len;
            compoundFound = true;
            break;
          }
        }
        if (compoundFound) continue;

        const kanjiMatch = resolveFallbackKanjiAt(str, i);
        if (kanjiMatch) {
          if (kanjiMatch.isOkuriStem) {
            res += (res && !res.endsWith(' ') ? ' ' : '') + kanjiMatch.romaji;
          } else {
            res += (res && !res.endsWith(' ') ? ' ' : '') + kanjiMatch.romaji + ' ';
          }
          i++;
          continue;
        }

        if (str[i] === 'っ' || str[i] === 'ッ') {
          if (i + 1 < str.length) {
            const nextTwo = str.substr(i + 1, 2);
            const nextOne = str[i + 1];
            const nextRomaji = KANA_MAP[nextTwo] || KANA_MAP[nextOne] || '';
            if (nextRomaji) {
              res += nextRomaji[0];
              i++;
              continue;
            }
          }
        }

        const twoChar = str.substr(i, 2);
        if (KANA_MAP[twoChar]) {
          res += KANA_MAP[twoChar];
          i += 2;
          continue;
        }

        if (KANA_MAP[str[i]]) {
          res += KANA_MAP[str[i]];
          i++;
          continue;
        }

        res += str[i];
        i++;
      }
      return res.replace(/\s+/g, ' ').trim();
    }

    function fallbackJapaneseFuriganaHtml(str) {
      let html = '';
      let i = 0;
      while (i < str.length) {
        let compoundFound = false;
        for (let len = 4; len >= 2; len--) {
          const sub = str.substr(i, len);
          if (KANJI_FALLBACK[sub]) {
            html += `<ruby>${escapeHtml(sub)}<rt>${KANJI_FALLBACK[sub].kana}</rt></ruby>`;
            i += len;
            compoundFound = true;
            break;
          }
        }
        if (compoundFound) continue;

        const kanjiMatch = resolveFallbackKanjiAt(str, i);
        if (kanjiMatch && kanjiMatch.kana) {
          html += `<ruby>${escapeHtml(str[i])}<rt>${kanjiMatch.kana}</rt></ruby>`;
          i++;
          continue;
        }

        html += escapeHtml(str[i]);
        i++;
      }
      return html.endsWith('\n') ? html + '\u200b' : html;
    }

    /* ==========================================================================
       Korean Hangul & Standalone Jamo to Revised Romanization (with Assimilation)
       ========================================================================== */
    const CHO_JAMO  = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
    const JUNG_JAMO = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
    const JONG_JAMO = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];

    const CHO_RR = {
      'ㄱ':'g','ㄲ':'kk','ㄴ':'n','ㄷ':'d','ㄸ':'tt','ㄹ':'r','ㅁ':'m','ㅂ':'b','ㅃ':'pp',
      'ㅅ':'s','ㅆ':'ss','ㅇ':'','ㅈ':'j','ㅉ':'jj','ㅊ':'ch','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'h'
    };
    const JUNG_RR = {
      'ㅏ':'a','ㅐ':'ae','ㅑ':'ya','ㅒ':'yae','ㅓ':'eo','ㅔ':'e','ㅕ':'yeo','ㅖ':'ye',
      'ㅗ':'o','ㅘ':'wa','ㅙ':'wae','ㅚ':'oe','ㅛ':'yo','ㅜ':'u','ㅝ':'wo','ㅞ':'we',
      'ㅟ':'wi','ㅠ':'yu','ㅡ':'eu','ㅢ':'ui','ㅣ':'i'
    };
    const JONG_RR = {
      '':'','ㄱ':'k','ㄲ':'k','ㄳ':'k','ㄴ':'n','ㄵ':'n','ㄶ':'n','ㄷ':'t',
      'ㄹ':'l','ㄺ':'k','ㄻ':'m','ㄼ':'l','ㄽ':'l','ㄾ':'l','ㄿ':'p','ㅀ':'l',
      'ㅁ':'m','ㅂ':'p','ㅄ':'p','ㅅ':'t','ㅆ':'t','ㅇ':'ng','ㅈ':'t','ㅊ':'t','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'t'
    };

    const STANDALONE_JAMO_MAP = {
      'ㄱ':'g','ㄲ':'kk','ㄳ':'ks','ㄴ':'n','ㄵ':'nj','ㄶ':'nh','ㄷ':'d','ㄸ':'tt','ㄹ':'r',
      'ㄺ':'lg','ㄻ':'lm','ㄼ':'lb','ㄽ':'ls','ㄾ':'lt','ㄿ':'lp','ㅀ':'lh','ㅁ':'m','ㅂ':'b',
      'ㅃ':'pp','ㅄ':'bs','ㅅ':'s','ㅆ':'ss','ㅇ':'ng','ㅈ':'j','ㅉ':'jj','ㅊ':'ch','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'h',
      'ㅏ':'a','ㅐ':'ae','ㅑ':'ya','ㅒ':'yae','ㅓ':'eo','ㅔ':'e','ㅕ':'yeo','ㅖ':'ye',
      'ㅗ':'o','ㅘ':'wa','ㅙ':'wae','ㅚ':'oe','ㅛ':'yo','ㅜ':'u','ㅝ':'wo','ㅞ':'we',
      'ㅟ':'wi','ㅠ':'yu','ㅡ':'eu','ㅢ':'ui','ㅣ':'i',
      'ᄀ':'g','ᄁ':'kk','ᄂ':'n','ᄃ':'d','ᄄ':'tt','ᄅ':'r','ᄆ':'m','ᄇ':'b','ᄈ':'pp',
      'ᄉ':'s','ᄊ':'ss','ᄋ':'ng','ᄌ':'j','ᄍ':'jj','ᄎ':'ch','ᄏ':'k','ᄐ':'t','ᄑ':'p','ᄒ':'h',
      'ᅡ':'a','ᅢ':'ae','ᅣ':'ya','ᅤ':'yae','ᅥ':'eo','ᅦ':'e','ᅧ':'yeo','ᅨ':'ye',
      'ᅩ':'o','ᅪ':'wa','ᅫ':'wae','ᅬ':'oe','ᅭ':'yo','ᅮ':'u','ᅯ':'wo','ᅰ':'we',
      'ᅱ':'wi','ᅲ':'yu','ᅳ':'eu','ᅴ':'ui','ᅵ':'i',
      'ᆨ':'k','ᆩ':'k','ᆪ':'k','ᆫ':'n','ᆬ':'n','ᆭ':'n','ᆮ':'t','ᆯ':'l','ᆰ':'k','ᆱ':'m',
      'ᆲ':'l','ᆳ':'l','ᆴ':'l','ᆵ':'p','ᆶ':'l','ᆷ':'m','ᆸ':'p','ᆹ':'p','ᆺ':'t','ᆻ':'t',
      'ᆼ':'ng','ᆽ':'t','ᆾ':'t','ᆿ':'k','ᇀ':'t','ᇁ':'p','ᇂ':'t'
    };

    const DOUBLE_JONG_SPLIT = {
      'ㄳ': ['ㄱ', 'ㅅ'],
      'ㄵ': ['ㄴ', 'ㅈ'],
      'ㄶ': ['ㄴ', 'ㅇ'],
      'ㄺ': ['ㄹ', 'ㄱ'],
      'ㄻ': ['ㄹ', 'ㅁ'],
      'ㄼ': ['ㄹ', 'ㅂ'],
      'ㄽ': ['ㄹ', 'ㅅ'],
      'ㄾ': ['ㄹ', 'ㅌ'],
      'ㄿ': ['ㄹ', 'ㅍ'],
      'ㅀ': ['ㄹ', 'ㅇ'],
      'ㅄ': ['ㅂ', 'ㅅ']
    };

    function neutralizeCoda(jong) {
      if (!jong) return '';
      if (['ㄱ','ㄲ','ㅋ','ㄳ','ㄺ'].includes(jong)) return 'ㄱ';
      if (['ㄴ','ㄵ','ㄶ'].includes(jong)) return 'ㄴ';
      if (['ㄷ','ㅅ','ㅆ','ㅈ','ㅊ','ㅌ','ㅎ'].includes(jong)) return 'ㄷ';
      if (['ㄹ','ㄼ','ㄽ','ㄾ','ㅀ'].includes(jong)) return 'ㄹ';
      if (['ㅁ','ㄻ'].includes(jong)) return 'ㅁ';
      if (['ㅂ','ㅍ','ㄿ','ㅄ'].includes(jong)) return 'ㅂ';
      if (jong === 'ㅇ') return 'ㅇ';
      return jong;
    }

    function romanizeKorean(str) {
      const tokens = [];
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i);
        if (code >= 0xAC00 && code <= 0xD7A3) {
          const syl = code - 0xAC00;
          const choIdx = Math.floor(syl / (21 * 28));
          const jungIdx = Math.floor((syl % (21 * 28)) / 28);
          const jongIdx = syl % 28;
          tokens.push({
            isSyl: true,
            cho: CHO_JAMO[choIdx],
            jung: JUNG_JAMO[jungIdx],
            jong: JONG_JAMO[jongIdx]
          });
        } else {
          tokens.push({
            isSyl: false,
            char: str[i]
          });
        }
      }

      for (let i = 0; i < tokens.length; i++) {
        const curr = tokens[i];
        if (!curr.isSyl) continue;

        const next = (i + 1 < tokens.length && tokens[i + 1].isSyl) ? tokens[i + 1] : null;
        if (!next || !curr.jong) {
          curr.jong = neutralizeCoda(curr.jong);
          continue;
        }

        // Rule A: Palatalization (구개음화)
        if (next.cho === 'ㅇ' && (next.jung === 'ㅣ' || next.jung === 'ㅕ')) {
          if (curr.jong === 'ㄷ') { curr.jong = ''; next.cho = 'ㅈ'; continue; }
          if (curr.jong === 'ㅌ') { curr.jong = ''; next.cho = 'ㅊ'; continue; }
          if (curr.jong === 'ㄾ') { curr.jong = 'ㄹ'; next.cho = 'ㅊ'; continue; }
        }
        if (curr.jong === 'ㄷ' && next.cho === 'ㅎ' && next.jung === 'ㅣ') {
          curr.jong = '';
          next.cho = 'ㅊ';
          continue;
        }

        // Rule B: Liaison / Resyllabification before vowel ('ㅇ')
        if (next.cho === 'ㅇ') {
          if (DOUBLE_JONG_SPLIT[curr.jong]) {
            const [rem, moved] = DOUBLE_JONG_SPLIT[curr.jong];
            curr.jong = rem;
            next.cho = moved;
          } else if (curr.jong === 'ㅎ') {
            curr.jong = '';
          } else if (curr.jong !== 'ㅇ') {
            next.cho = curr.jong;
            curr.jong = '';
          }
          continue;
        }

        // Rule C: Aspiration / 'ㅎ' Coalescence (격음화)
        const ASPIRATION_TARGET = { 'ㄱ': 'ㅋ', 'ㄷ': 'ㅌ', 'ㅂ': 'ㅍ', 'ㅈ': 'ㅊ' };
        if (['ㅎ', 'ㄶ', 'ㅀ'].includes(curr.jong) && ASPIRATION_TARGET[next.cho]) {
          next.cho = ASPIRATION_TARGET[next.cho];
          curr.jong = curr.jong === 'ㄶ' ? 'ㄴ' : (curr.jong === 'ㅀ' ? 'ㄹ' : '');
        } else if (['ㅎ', 'ㄶ', 'ㅀ'].includes(curr.jong) && next.cho === 'ㅅ') {
          next.cho = 'ㅆ';
          curr.jong = curr.jong === 'ㄶ' ? 'ㄴ' : (curr.jong === 'ㅀ' ? 'ㄹ' : '');
        } else if (['ㅎ', 'ㄶ', 'ㅀ'].includes(curr.jong) && next.cho === 'ㄴ') {
          curr.jong = curr.jong === 'ㄶ' ? 'ㄴ' : (curr.jong === 'ㅀ' ? 'ㄹ' : 'ㄴ');
        } else if (next.cho === 'ㅎ') {
          const normJong = neutralizeCoda(curr.jong);
          if (['ㄷ', 'ㅈ', 'ㅊ', 'ㅌ'].includes(curr.jong)) {
            curr.jong = '';
            next.cho = curr.jong === 'ㄷ' || curr.jong === 'ㅌ' ? 'ㅌ' : 'ㅊ';
            continue;
          } else if (normJong === 'ㄱ' || normJong === 'ㅂ') {
            curr.jong = normJong;
          }
        }

        curr.jong = neutralizeCoda(curr.jong);

        // Rule D: Nasalization of 'ㄹ' after non-'ㄹ' consonants
        if (next.cho === 'ㄹ' && ['ㄱ', 'ㄷ', 'ㅂ', 'ㅁ', 'ㅇ'].includes(curr.jong)) {
          next.cho = 'ㄴ';
        }

        // Rule E: Obstruent Nasalization before 'ㄴ' or 'ㅁ'
        if (next.cho === 'ㄴ' || next.cho === 'ㅁ') {
          if (curr.jong === 'ㄱ') curr.jong = 'ㅇ';
          else if (curr.jong === 'ㄷ') curr.jong = 'ㄴ';
          else if (curr.jong === 'ㅂ') curr.jong = 'ㅁ';
        }

        // Rule F: Liquidization of 'ㄴ'+'ㄹ' or 'ㄹ'+'ㄴ' -> 'ㄹ'+'ㄹ'
        if ((curr.jong === 'ㄴ' && next.cho === 'ㄹ') || (curr.jong === 'ㄹ' && next.cho === 'ㄴ')) {
          curr.jong = 'ㄹ';
          next.cho = 'ㄹ';
        }
      }

      let result = '';
      for (let i = 0; i < tokens.length; i++) {
        const tok = tokens[i];
        if (!tok.isSyl) {
          result += STANDALONE_JAMO_MAP[tok.char] !== undefined ? STANDALONE_JAMO_MAP[tok.char] : tok.char;
          continue;
        }

        const prev = (i > 0 && tokens[i - 1].isSyl) ? tokens[i - 1] : null;
        const choRom = (tok.cho === 'ㄹ' && prev && prev.jong === 'ㄹ')
          ? 'l'
          : (CHO_RR[tok.cho] ?? '');
        const jungRom = JUNG_RR[tok.jung] ?? '';
        const jongRom = JONG_RR[tok.jong] ?? '';

        result += choRom + jungRom + jongRom;
      }

      return result;
    }

    /* Russian Cyrillic to Latin Transliteration (BGN/PCGN & GOST) */
    const CYRILLIC_MAP = {
      'А':'A','Б':'B','В':'V','Г':'G','Д':'D','Е':'E','Ё':'Yo','Ж':'Zh','З':'Z','И':'I','Й':'Y',
      'К':'K','Л':'L','М':'M','Н':'N','О':'O','П':'P','Р':'R','С':'S','Т':'T','У':'U','Ф':'F',
      'Х':'Kh','Ц':'Ts','Ч':'Ch','Ш':'Sh','Щ':'Shch','Ъ':'"','Ы':'Y','Ь':"'",'Э':'E','Ю':'Yu','Я':'Ya',
      'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y',
      'к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f',
      'х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ъ':'"','ы':'y','ь':"'",'э':'e','ю':'yu','я':'ya'
    };

    function romanizeRussian(str) {
      let res = '';
      for (const ch of str) {
        res += CYRILLIC_MAP[ch] !== undefined ? CYRILLIC_MAP[ch] : ch;
      }
      return res;
    }

    /* Chinese Pinyin Generator */
    function romanizeChinese(str) {
      if (typeof pinyinPro !== 'undefined' && pinyinPro.pinyin) {
        return pinyinPro.pinyin(str, { toneType: 'symbol' });
      }
      return str;
    }

    /* ==========================================================================
       === CHECKPOINT 3 & 4 (JS): Single-Source-of-Truth Furigana + Romaji Sync ===
       ========================================================================== */
    let currentConversionId = 0;

    async function updateRomanization() {
      const text = textOutputBox.value;
      const conversionId = ++currentConversionId;
      charCount.textContent = `${text.length} char${text.length === 1 ? '' : 's'}`;

      if (!text) {
        furiganaBackdrop.innerHTML = '';
        romanizedOutputBox.value = '';
        autoResizeBoxes();
        return;
      }

      if (currentLang === 'ja') {
        furiganaBackdrop.innerHTML = fallbackJapaneseFuriganaHtml(text);
        autoResizeBoxes();

        if (!text.trim()) {
          romanizedOutputBox.value = '';
          autoResizeBoxes();
          return;
        }

        if (isKuroshiroReady && kuroshiroInstance) {
          try {
            const safeText = escapeHtml(text);
            const [furiganaHtml, romaji] = await Promise.all([
              kuroshiroInstance.convert(safeText, {
                to: 'hiragana',
                mode: 'furigana'
              }),
              kuroshiroInstance.convert(text, {
                to: 'romaji',
                mode: 'spaced',
                romajiSystem: 'hepburn'
              })
            ]);

            if (conversionId !== currentConversionId || currentLang !== 'ja') return;

            furiganaBackdrop.innerHTML = furiganaHtml.endsWith('\n')
              ? furiganaHtml + '\u200b'
              : furiganaHtml;
            romanizedOutputBox.value = romaji;
            autoResizeBoxes();
            return;
          } catch (e) {
            console.warn("Kuroshiro conversion error, running kanjiapi.dev fallback:", e);
          }
        }

        romanizedOutputBox.value = fallbackJapaneseRomanize(text);
        autoResizeBoxes();

        await ensureKanjiReadingsLoaded(text);
        if (conversionId !== currentConversionId || currentLang !== 'ja') return;

        furiganaBackdrop.innerHTML = fallbackJapaneseFuriganaHtml(text);
        romanizedOutputBox.value = fallbackJapaneseRomanize(text);
        autoResizeBoxes();
      } else {
        furiganaBackdrop.innerHTML = '';
        if (!text.trim()) {
          romanizedOutputBox.value = '';
          autoResizeBoxes();
          return;
        }
        if (currentLang === 'zh') {
          romanizedOutputBox.value = romanizeChinese(text);
        } else if (currentLang === 'ko') {
          romanizedOutputBox.value = romanizeKorean(text);
        } else if (currentLang === 'ru') {
          romanizedOutputBox.value = romanizeRussian(text);
        }
        autoResizeBoxes();
      }
    }
    /* === END CHECKPOINT 3 & 4 (JS) === */

    /* Listen to manual edits in Box 1 */
    textOutputBox.addEventListener('input', () => {
      updateRomanization();
    });

    /* ==========================================================================
       Language Tab Switching
       ========================================================================== */
    const tabs = document.querySelectorAll('.lang-tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => {
          t.classList.remove('active-tab', 'border-indigo-600', 'text-indigo-600');
          t.classList.add('border-transparent', 'text-slate-600');
        });
        
        tab.classList.add('active-tab', 'border-indigo-600', 'text-indigo-600');
        tab.classList.remove('border-transparent', 'text-slate-600');

        currentLang = tab.getAttribute('data-lang');
        const langConfig = LANGUAGES[currentLang];

        drawingInstructions.textContent = langConfig.instruction;
        romanizationLabel.textContent = langConfig.romajiName;
        translitDesc.textContent = langConfig.desc;

        textOutputBox.setAttribute('lang', currentLang);
        if (currentLang === 'ja') {
          textOutputBox.classList.add('overlay-ja-active');
          furiganaBackdrop.classList.remove('hidden');
        } else {
          textOutputBox.classList.remove('overlay-ja-active');
          furiganaBackdrop.classList.add('hidden');
        }

        if (langConfig.guideType === 'cyrillic') {
          gridGuide.className = 'absolute inset-0 cyrillic-grid pointer-events-none';
        } else {
          gridGuide.className = 'absolute inset-0 cjk-grid pointer-events-none';
        }

        clearCanvas();
        updateRomanization();
      });
    });

    /* ==========================================================================
       Toolbar & Quick Action Buttons
       ========================================================================== */
    document.getElementById('btn-clear-canvas').addEventListener('click', clearCanvas);
    document.getElementById('btn-undo').addEventListener('click', undoLastStroke);

    document.getElementById('btn-add-space').addEventListener('click', () => {
      insertCharacter(' ');
    });

    document.getElementById('btn-backspace').addEventListener('click', () => {
      const originalText = textOutputBox.value;
      if (originalText.length > 0) {
        textOutputBox.value = originalText.slice(0, -1);
        textOutputBox.blur();
        updateRomanization();
      }
    });

    document.getElementById('btn-clear-text').addEventListener('click', () => {
      textOutputBox.value = '';
      furiganaBackdrop.innerHTML = '';
      romanizedOutputBox.value = '';
      textOutputBox.blur();
      charCount.textContent = '0 chars';
      autoResizeBoxes();
    });

    /* Clipboard Copy Feedback */
    function showToast(msg) {
      toastMessage.textContent = msg;
      toast.classList.remove('translate-y-12', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-12', 'opacity-0');
      }, 2000);
    }

    async function copyToClipboard(text, label) {
      if (!text) {
        showToast('Nothing to copy!');
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        showToast(`Copied ${label} to clipboard!`);
      } catch (err) {
        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast(`Copied ${label} to clipboard!`);
      }
    }

    document.getElementById('btn-copy-box1').addEventListener('click', () => {
      copyToClipboard(textOutputBox.value, 'Character text');
    });

    document.getElementById('btn-copy-box2').addEventListener('click', () => {
      copyToClipboard(romanizedOutputBox.value, 'Romanization');
    });

    /* ==========================================================================
       Lifecycle Initialization
       ========================================================================== */
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      initKuroshiro();
    });
    window.addEventListener('load', () => {
      initOfflineRecognizers();
