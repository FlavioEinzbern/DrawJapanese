<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Multilingual Handwriting & Romanizer</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="src/css/styles.css" />

  <!-- Japanese Morphological & Furigana/Romaji Engine (Kuroshiro + Kuromoji) -->
  <script src="https://cdn.jsdelivr.net/npm/kuroshiro@1.2.0/dist/kuroshiro.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/kuroshiro-analyzer-kuromoji@1.1.0/dist/kuroshiro-analyzer-kuromoji.min.js"></script>

  <!-- Chinese Pinyin Engine (pinyin-pro) -->
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>

  <!-- Offline CJK Handwriting Fallback Engines -->
  <script src="https://cdn.jsdelivr.net/gh/asdfjkl/kanjicanvas@master/kanji-canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/asdfjkl/kanjicanvas@master/ref-patterns.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/gugray/HanziLookupJS@master/dist/hanzilookup.min.js"></script>
</head>
<body class="dark-mode bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-700 transition-colors duration-150">

  <!-- Top Navigation & Language Selector -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs transition-colors duration-150">
    <div class="max-w-5xl mx-auto px-3 sm:px-6 flex items-center justify-between h-12 sm:h-14">
      <!-- Language Flag Tabs -->
      <nav class="flex items-center space-x-1 sm:space-x-2 overflow-x-auto hide-scrollbar" aria-label="Language Tabs">
        <button type="button" data-lang="ja" class="lang-tab active-tab flex items-center gap-1.5 px-2.5 sm:px-3.5 py-2 border-b-2 border-indigo-600 text-indigo-600 font-semibold text-xs sm:text-sm whitespace-nowrap transition-all">
          <span class="text-base sm:text-lg leading-none">🇯🇵</span>
          <span>Japanese</span>
        </button>
        <button type="button" data-lang="zh" class="lang-tab flex items-center gap-1.5 px-2.5 sm:px-3.5 py-2 border-b-2 border-transparent text-slate-600 hover:text-slate-900 font-medium text-xs sm:text-sm whitespace-nowrap transition-all">
          <span class="text-base sm:text-lg leading-none">🇨🇳</span>
          <span>Chinese</span>
        </button>
        <button type="button" data-lang="ko" class="lang-tab flex items-center gap-1.5 px-2.5 sm:px-3.5 py-2 border-b-2 border-transparent text-slate-600 hover:text-slate-900 font-medium text-xs sm:text-sm whitespace-nowrap transition-all">
          <span class="text-base sm:text-lg leading-none">🇰🇷</span>
          <span>Korean</span>
        </button>
        <button type="button" data-lang="ru" class="lang-tab flex items-center gap-1.5 px-2.5 sm:px-3.5 py-2 border-b-2 border-transparent text-slate-600 hover:text-slate-900 font-medium text-xs sm:text-sm whitespace-nowrap transition-all">
          <span class="text-base sm:text-lg leading-none">🇷🇺</span>
          <span>Russian</span>
        </button>
      </nav>

      <!-- Top-Right Status Indicator + Dark Mode Toggle -->
      <div class="flex items-center gap-2 shrink-0 ml-2">
        <div id="status-badge" title="Loading dictionary..." class="group flex items-center text-xs font-medium p-1.5 hover:px-2.5 hover:py-1 rounded-full border bg-amber-50 text-amber-700 border-amber-200 transition-all cursor-default">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse shrink-0"></span>
          <span id="status-text" class="hidden group-hover:inline-block ml-1.5 whitespace-nowrap">Loading dictionary...</span>
        </div>

        <button id="btn-theme-toggle" type="button" title="Switch to Light Mode" aria-label="Toggle Dark Mode" class="p-1.5 rounded-full border border-slate-200 bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all flex items-center justify-center">
          <!-- Icon injected by main.js -->
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="max-w-5xl w-full mx-auto px-3 sm:px-6 py-3 sm:py-5 space-y-3 sm:space-y-4 flex-1">
    <!-- Drawing Canvas Card -->
    <section class="workspace-card bg-white rounded-2xl border border-slate-200/90 shadow-xs p-3 sm:p-4 space-y-2.5 transition-colors duration-150">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span id="drawing-instructions" class="text-xs sm:text-sm font-semibold text-slate-700 truncate">
            Draw Japanese (Kanji, Hiragana, Katakana)
          </span>
          <span id="recognizing-indicator" class="hidden text-xs font-medium text-indigo-600 animate-pulse shrink-0">
            Recognizing...
          </span>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button id="btn-undo" type="button" class="px-2.5 py-1 text-xs font-medium text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg transition-colors">
            Undo
          </button>
          <button id="btn-clear-canvas" type="button" class="px-2.5 py-1 text-xs font-medium text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100/80 rounded-lg transition-colors">
            Clear Canvas
          </button>
        </div>
      </div>

      <!-- Interactive Canvas Viewport -->
      <div class="canvas-viewport relative w-full bg-slate-50/60 border-2 border-dashed border-slate-300 rounded-xl overflow-hidden transition-colors duration-150">
        <div id="grid-guide" class="absolute inset-0 cjk-grid pointer-events-none"></div>
        <canvas id="drawing-canvas" class="relative z-10 w-full h-full block"></canvas>
        <canvas id="offline-kanji-canvas" width="256" height="256" class="hidden"></canvas>
      </div>

      <!-- Recognition Candidates Strip (Floats inside bottom of canvas) -->
      <div>
        <div class="candidate-header flex items-center justify-between text-xs text-slate-400 mb-1">
          <span>Recognition Candidates</span>
        </div>
        <div id="candidates-container" class="flex items-center gap-2 overflow-x-auto hide-scrollbar min-h-[44px] p-1">
          <span class="text-xs text-slate-400 italic px-3">Draw a character on the canvas above...</span>
        </div>
      </div>
    </section>

    <!-- Dual Output Boxes (Box 1: Characters + Furigana, Box 2: Writable Romanization) -->
    <section class="dual-boxes-grid">
      <!-- Box 1: Original Script + Japanese Furigana Overlay -->
      <div class="box-card bg-white rounded-2xl border border-slate-200/90 shadow-xs p-3 sm:p-4 flex flex-col transition-colors duration-150">
        <div class="box-card-header flex items-center justify-between gap-2 mb-2">
          <div class="flex items-center gap-2">
            <h2 class="text-xs sm:text-sm font-semibold text-slate-700">Recognized Text</h2>
            <span id="char-count" class="text-[11px] font-medium text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">0 chars</span>
          </div>
          <div class="flex items-center gap-1">
            <button id="btn-add-space" type="button" title="Insert Space" class="px-2 py-1 text-xs font-medium text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg transition-colors">
              Space
            </button>
            <button id="btn-backspace" type="button" title="Backspace" class="px-2 py-1 text-xs font-medium text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg transition-colors">
              ⌫
            </button>
            <button id="btn-clear-text" type="button" title="Clear All Text" class="px-2 py-1 text-xs font-medium text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100/80 rounded-lg transition-colors">
              Clear
            </button>
            <button id="btn-copy-box1" type="button" title="Copy Text" class="px-2.5 py-1 text-xs font-semibold text-indigo-600 hover:text-indigo-700 bg-indigo-50 hover:bg-indigo-100/80 rounded-lg transition-colors">
              Copy
            </button>
          </div>
        </div>

        <div id="box1-wrapper" class="auto-grow-box relative w-full bg-slate-50/70 border border-slate-200 rounded-xl overflow-hidden transition-colors duration-150">
          <div id="furigana-backdrop" aria-hidden="true" class="box1-shared-metrics absolute inset-0 w-full h-full text-slate-800 pointer-events-none select-none overflow-hidden"></div>
          <textarea id="text-output-box" lang="ja" rows="2" spellcheck="false" class="box1-shared-metrics auto-grow-box overlay-ja-active relative z-10 w-full h-full bg-transparent text-slate-800 focus:outline-none resize-none"></textarea>
        </div>

        <div class="box-footer mt-2 pt-1.5 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
          <span>Editable — draw or type directly</span>
        </div>
      </div>

      <!-- Box 2: Writable Romanization / Transliteration Output -->
      <div class="box-card bg-white rounded-2xl border border-slate-200/90 shadow-xs p-3 sm:p-4 flex flex-col transition-colors duration-150">
        <div class="box-card-header flex items-center justify-between gap-2 mb-2">
          <div class="flex items-center gap-2">
            <h2 id="romanization-label" class="text-xs sm:text-sm font-semibold text-slate-700">Romaji (Hepburn)</h2>
          </div>
          <div class="flex items-center gap-1">
            <button id="btn-copy-box2" type="button" title="Copy Romanization" class="px-2.5 py-1 text-xs font-semibold text-emerald-600 hover:text-emerald-700 bg-emerald-50 hover:bg-emerald-100/80 rounded-lg transition-colors">
              Copy
            </button>
          </div>
        </div>

        <div id="box2-wrapper" class="auto-grow-box relative w-full bg-slate-50/70 border border-slate-200 rounded-xl overflow-hidden transition-colors duration-150">
          <div id="romanized-backdrop" aria-hidden="true" class="box1-shared-metrics absolute inset-0 w-full h-full text-slate-700 pointer-events-none select-none overflow-hidden"></div>
          <textarea id="romanized-output-box" rows="2" spellcheck="false" class="box1-shared-metrics auto-grow-box overlay-box2-active relative z-10 w-full h-full bg-transparent text-slate-700 focus:outline-none resize-none"></textarea>
        </div>

        <div class="box-footer mt-2 pt-1.5 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
          <span id="translit-mode-description">Editable — lowercase → Hiragana, UPPERCASE → Katakana</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Clipboard Toast Notification -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 transform translate-y-12 opacity-0 transition-all duration-200 pointer-events-none">
    <div class="bg-slate-900 text-white text-xs font-medium px-3.5 py-2 rounded-xl shadow-lg border border-slate-700">
      <span id="toast-message">Copied to clipboard!</span>
    </div>
  </div>

  <!-- Application Scripts -->
  <script src="src/js/config-dictionaries.js"></script>
  <script src="src/js/romanizer.js"></script>
  <script src="src/js/canvas-handwriting.js"></script>
  <script src="src/js/ime-writable.js"></script>
  <script src="src/js/main.js"></script>
</body>
</html>
